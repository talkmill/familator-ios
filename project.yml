name: Familator
options:
  bundleIdPrefix: com.familator
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '15.0'
  generateEmptyDirectories: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base: {}
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: '2.0.0'
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: '8.0.0'
targets:
  Familator:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Familator
        excludes:
          - '*.plist'
    resources:
      - path: Familator/Resources/Fonts
        buildPhase: resources
      - path: Familator/Resources/TipTapEditor
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Familator/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.familator.app
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn

  FamilatorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    hostApplication: Familator
    sources:
      - path: FamilatorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familator.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Familator
